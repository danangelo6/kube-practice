# chart: grafana/grafana
adminUser: admin
persistence:
  enabled: false
resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits:   { memory: 192Mi }
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        folder: ""
        type: file
        options:
          path: /var/lib/grafana/dashboards/default
dashboards:
  default:
    node-exporter:
      gnetId: 1860       # Node Exporter Full
      revision: 37
      datasource: Prometheus
    k8s-pods:
      gnetId: 15760      # Kubernetes / Views / Pods
      revision: 36
      datasource: Prometheus
